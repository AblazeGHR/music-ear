pluginManagement {
    repositories {
        google()
        // Mirror of Maven Central first: it is much faster from mainland
        // China, where repo1.maven.org frequently crawls.
        maven { url 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
    }
}

rootProject.name = 'earpath'
include ':app'
